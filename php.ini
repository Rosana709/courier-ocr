; Configuration PHP pour suppimer les warnings de dépréciation PHP 8.4
; avec Symfony 6.1

; Supprimer E_STRICT et E_DEPRECATED pour éviter les warnings
error_reporting = E_ALL & ~E_STRICT & ~E_DEPRECATED

; Autres configurations recommandées pour le développement
display_errors = On
display_startup_errors = On
log_errors = On
error_log = php_errors.log

; Configuration recommandée pour Symfony
max_execution_time = 30
memory_limit = 512M
post_max_size = 64M
upload_max_filesize = 64M

; Extensions requises (décommenter si nécessaire)
; extension=pdo_pgsql
; extension=openssl
; extension=mbstring
; extension=curl