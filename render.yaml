services:
  # 1. Backend OCR (FastAPI)
  - type: web
    name: sgc-ocr-backend
    env: python
    rootDir: ocr-system/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GROQ_API_KEY
        sync: false

  # 2. Application Symfony (Docker)
  - type: web
    name: sgc-symfony-app
    env: docker
    rootDir: .
    dockerfilePath: Dockerfile
    preDeployCommand: php bin/console doctrine:migrations:migrate --no-interaction && php bin/console doctrine:fixtures:load --append --no-interaction
    plan: free
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sgc-db
          property: connectionString
      - key: OCR_BACKEND_URL
        fromService:
          type: web
          name: sgc-ocr-backend
          property: host
      - key: TRUSTED_PROXIES
        value: 0.0.0.0/0,::/0
      - key: MAILER_DSN
        value: smtp://razanajatovoestelle%40gmail.com:wkviqggpsjvejezw@smtp.gmail.com:587?encryption=tls
      - key: DEFAULT_MAILER_SENDER
        value: ne-pas-repondre@dgi.gov.mg
      - key: MESSENGER_TRANSPORT_DSN
        value: doctrine://default?auto_setup=0

databases:
  - name: sgc-db
    databaseName: gestion_courier
    user: admin_sgc
    plan: free
